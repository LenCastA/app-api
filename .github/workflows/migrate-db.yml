name: Migrate Database

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      java-version:
        required: false
        type: string
        default: "25"
        description: "Java version to use for migration"
      skip-seeds:
        required: false
        type: boolean
        default: false
        description: "Whether to skip seed migrations"
    secrets:
      SPRING_DATASOURCE_USERNAME:
        required: true
      SPRING_DATASOURCE_PASSWORD:
        required: true
      SPRING_DATASOURCE_URL:
        required: true
      SPRING_DATASOURCE_SCHEMA:
        required: true
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to migrate"
        type: environment
        required: true
      java-version:
        description: "Java version to use for migration"
        type: string
        required: false
        default: "25"
      skip-seeds:
        description: "Whether to skip seed migrations"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  migrate:
    name: Run Database Migration
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ inputs.java-version }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-disabled: true

      - name: Make Gradlew executable
        run: chmod +x gradlew

      - name: Clone app-data repository
        run: |
          git clone --depth 1 https://github.com/LenCastA/app-data.git app-data

      - name: Validate CSV data files
        working-directory: app-data
        run: python3 scripts/validate_seeds.py

      - name: Sync CSV data files
        run: |
          mkdir -p src/main/resources/db/data
          find src/main/resources/db/data -type f -name '*.csv' -delete
          rsync -av --delete --include='*/' --include='*.csv' --exclude='*' app-data/seeds/ src/main/resources/db/data/
          echo "CSV files synced from app-data repository"

      - name: Build and Migrate Database
        run: ./gradlew assemble flywayMigrate -Pflyway.placeholders.skipSeeds=${{ inputs.skip-seeds }} -i
        env:
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_SCHEMA: ${{ secrets.SPRING_DATASOURCE_SCHEMA }}
